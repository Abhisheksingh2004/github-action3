name: Intentional Failure Test

# This makes the action run when you push, or manually from the Actions tab
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  test-failure:
    runs-on: ubuntu-latest
    steps:
      - name: Print a message
        run: echo "Starting the job..."

      - name: Completion Step
        run: |
          echo "Workflow completed successfully"
